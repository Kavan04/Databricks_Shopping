[package]
name = "shopping"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shopping"
path = "src/main.rs"

[dependencies]
memchr = "2"
libc = "0.2"
bytes = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
parquet = { version = "56", default-features = false }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
